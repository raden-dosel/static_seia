<section id="contact" class="section">
  <div class="container">
    <header class="page-header">
      <h1>Contact</h1>
      <p class="lede">Have a project in mind or just want to say hello? Let’s talk.</p>
    </header>

    <section class="contact-grid">
      <aside class="contact-info" aria-labelledby="contact-info-title">
        <h2 id="contact-info-title" class="sr-only">Contact information</h2>

        <div class="card contact-card">
          <h3>Get in Touch</h3>
          <div class="contact-methods">
            <a href="mailto:sherwinmadrid210@gmail.com" class="contact-method">
              <span class="contact-icon">✉️</span>
              <div class="contact-details">
                <span class="contact-label">Email</span>
                <span class="contact-value">sherwinmadrid210@gmail.com</span>
              </div>
            </a>
            <a href="tel:+639770159162" class="contact-method">
              <span class="contact-icon">📱</span>
              <div class="contact-details">
                <span class="contact-label">Phone</span>
                <span class="contact-value">0977 015 9162</span>
              </div>
            </a>
          </div>
        </div>

        <div class="card social-card">
          <h3>Follow Us</h3>
          <ul class="social-list">
            <li><a href="https://www.facebook.com/profile.php?id=100088409341712" target="_blank" rel="noopener" class="social-link">👍 Facebook</a></li>
          </ul>
        </div>

        <p class="note">💬 Prefer email? I usually reply within 1–2 business days.</p>
      </aside>

      <section class="contact-form" aria-labelledby="contact-form-title">
        <h2 id="contact-form-title" class="sr-only">Contact form</h2>

        <form id="contact-form" novalidate>
          <!-- Honeypot: leave blank -->
          <label class="hp" aria-hidden="true">
            Company
            <input type="text" name="company" tabindex="-1" autocomplete="off" />
          </label>

          <!-- Submission timer -->
          <input type="hidden" name="form_start" id="form_start" />

          <div class="field">
            <label for="name">Name *</label>
            <input id="name" name="name" type="text" required minlength="2" maxlength="100" autocomplete="name" />
            <small class="error" data-for="name"></small>
          </div>

          <div class="field">
            <label for="email">Email *</label>
            <input id="email" name="email" type="email" required inputmode="email" autocomplete="email" />
            <small class="error" data-for="email"></small>
          </div>

          <div class="field">
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" maxlength="150" required />
            <small class="error" data-for="subject"></small>
          </div>

          <div class="field">
            <label for="message">Message *</label>
            <textarea id="message" name="message" required minlength="10" maxlength="2000" rows="6"></textarea>
            <small class="error" data-for="message"></small>
          </div>

          <div class="actions">
            <button id="submit-btn" type="submit" class="btn" disabled>
              <span class="btn-label">Send message</span>
              <span class="spinner" aria-hidden="true"></span>
            </button>
            <p id="form-feedback" class="feedback" role="status" aria-live="polite"></p>
          </div>
        </form>
      </section>
    </section>
  </div>
</section>
